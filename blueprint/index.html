<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Blueprint</title>
  <meta name="description" content="A free floor plan and room design app that runs in your browser.">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M3 3h18v18H3z M3 12h9 M12 3v13 M16 16h5" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
      <span>Blueprint</span>
    </div>
    <div class="topbar-group">
      <button class="icon-btn" id="undoBtn" title="Undo (Ctrl+Z)" aria-label="Undo">
        <svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>
      </button>
      <button class="icon-btn" id="redoBtn" title="Redo (Ctrl+Shift+Z)" aria-label="Redo">
        <svg viewBox="0 0 24 24"><path d="m15 14 5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg>
      </button>
    </div>
    <div class="topbar-group">
      <div class="segmented" role="group" aria-label="Units">
        <button data-units="imperial">ft · in</button>
        <button data-units="metric">m</button>
      </div>
    </div>
    <div class="spacer"></div>
    <div class="topbar-group">
      <button class="icon-btn" id="zoomOut" title="Zoom out (−)" aria-label="Zoom out"><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>
      <button class="zoom-label" id="zoomLabel" title="Fit plan to screen (F)">100%</button>
      <button class="icon-btn" id="zoomIn" title="Zoom in (+)" aria-label="Zoom in"><svg viewBox="0 0 24 24"><path d="M5 12h14M12 5v14"/></svg></button>
    </div>
  </header>

  <div class="workspace">
    <nav class="toolbar" aria-label="Tools">
      <button class="tool" data-tool="select" title="Select & move (V)">
        <svg viewBox="0 0 24 24"><path d="M5 3l14 8-6 1.5L10 19z"/></svg><span>Select</span>
      </button>
      <button class="tool" data-tool="pan" title="Pan (H) — or hold Space, or drag with the middle mouse button">
        <svg viewBox="0 0 24 24"><path d="M8 13V5.5a1.5 1.5 0 0 1 3 0V12"/><path d="M11 11.5v-8a1.5 1.5 0 0 1 3 0V12"/><path d="M14 5.5a1.5 1.5 0 0 1 3 0V12"/><path d="M17 8.5a1.5 1.5 0 0 1 3 0V15a6 6 0 0 1-6 6h-2a6 6 0 0 1-5-2.7L4.3 14a1.6 1.6 0 0 1 2.6-1.9L8 13"/></svg><span>Pan</span>
      </button>
      <div class="tool-sep"></div>
      <button class="tool" data-tool="rect" title="Rectangle room (R)">
        <svg viewBox="0 0 24 24"><rect x="4" y="6" width="16" height="12" rx="1"/></svg><span>Room</span>
      </button>
      <button class="tool" data-tool="poly" title="Any-shape room (P) — click each corner">
        <svg viewBox="0 0 24 24"><path d="M4 19 6 6l9-2 5 8-6 7z"/><circle cx="6" cy="6" r="1.3" fill="currentColor"/><circle cx="15" cy="4" r="1.3" fill="currentColor"/><circle cx="20" cy="12" r="1.3" fill="currentColor"/></svg><span>Shape</span>
      </button>
      <button class="tool" data-tool="wall" title="Standalone wall (W) — half walls, partitions">
        <svg viewBox="0 0 24 24"><path d="M4 18 20 6" stroke-width="4"/></svg><span>Wall</span>
      </button>
      <button class="tool" data-tool="split" title="Split a wall (S)">
        <svg viewBox="0 0 24 24"><path d="M3 12h7M14 12h7"/><path d="M12 5v14" stroke-dasharray="2 2.5"/></svg><span>Split</span>
      </button>
    </nav>

    <main class="stage" id="stage">
      <canvas id="plan"></canvas>
      <input id="lenInput" class="len-input" type="text" autocomplete="off" spellcheck="false" hidden>
      <div class="empty-hint" id="emptyHint">
        <strong>Start your floor plan</strong>
        <span>Pick <b>Room</b> (R) to drag out a rectangle, or <b>Shape</b> (P) to click corners at any angle.</span>
      </div>
    </main>

    <aside class="panel" id="panel" aria-label="Properties"></aside>
  </div>

  <footer class="statusbar">
    <span id="hint"></span>
    <span class="spacer"></span>
    <span id="snapState"></span>
    <span id="coords"></span>
  </footer>

  <script type="module" src="js/app.js"></script>
</body>
</html>
